# Claim register. A page may use a claim only when status is PROVEN.
# A build check (added in slice 2) fails if any page references a claim that is not PROVEN.
# status: REQUIRED = the owner has not yet supplied proof. PROVEN = proof file and owner named.
# Wording for REQUIRED claims is deliberately empty: nothing ships until it is proven.
# Evidence references point to files kept outside this repository when they hold personal data.
# Updated 30 Oct 2026 from the Phase 0 claims audit (kept privately, not in this repository).

company_identity:
  status: PROVEN
  text: "Vitalcare Training Hub Ltd, company number 15718997, registered in England and Wales. Registered office: 11 Halesworth Road, London SE13 7TJ."
  evidence: "Companies House record read directly 30 Oct 2026: VITALCARE TRAINING HUB LTD, Active, private limited company, registered office 11 Halesworth Road, London, England, SE13 7TJ. Re-check before launch"
  owner: "owner"

company_incorporated:
  status: PROVEN
  text: "Incorporated on 14 May 2024."
  evidence: "Companies House record read directly 30 Oct 2026: incorporated 14 May 2024"
  owner: "owner"

contact_details:
  status: PROVEN
  text: "Email info@vitalcare.uk. Telephone 020 8059 8757. Monday to Friday, 9am to 5pm."
  evidence: "Owner reply 30 Oct 2026; hours as stated on the current contact page"
  owner: "owner"

