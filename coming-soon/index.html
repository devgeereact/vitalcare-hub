<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex, nofollow" />
    <meta name="description" content="Care-sector training, certificates anyone can verify, and the staff compliance register behind them. Vitalcare Training Hub Ltd." />
    <title>Vitalcare Training Hub — coming soon</title>
    <style>
      :root {
        color-scheme: dark;
        --bg: #11172c;
        --text: #f3f4ff;
        --muted: #c5cbdd;
        --accent: #bba0ff;
        font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
        background: var(--bg);
        color: var(--text);
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100svh;
        display: grid;
        place-items: center;
        padding: 28px;
        background: radial-gradient(ellipse at 80% 10%, #40346b 0, transparent 55%), var(--bg);
      }
      main {
        max-width: 740px;
        padding: clamp(26px, 6vw, 70px);
        border: 1px solid #ffffff20;
        border-radius: 28px;
        background: #11172cb8;
      }
      small { color: #d0c5f1; letter-spacing: 0.15em; text-transform: uppercase; }
      h1 { font-size: clamp(38px, 7vw, 76px); line-height: 1.06; letter-spacing: -0.04em; margin: 24px 0; }
      p { color: var(--muted); font-size: clamp(17px, 2vw, 21px); line-height: 1.6; }
      .badge {
        display: inline-flex; align-items: center; gap: 10px; font-size: 13px;
        border: 1px solid #ffffff30; padding: 10px 16px; border-radius: 30px;
      }
      .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--accent); }
      footer { margin-top: 50px; font-size: 12px; color: #aab0c8; }
    </style>
  </head>
  <body>
    <main>
      <small>Vitalcare Training Hub</small>
      <!-- Edit this headline and line. Keep it honest: no dates or features that are not certain. -->
      <h1>Something worth waiting for.</h1>
      <p>Care-sector training, certificates anyone can verify, and the staff compliance register behind them. Vitalcare Training Hub Ltd.</p>
      <span class="badge"><span class="dot" aria-hidden="true"></span>Coming soon</span>
      <footer>Build: <span>REPLACE_WITH_PUBLIC_BUILD_ID</span></footer>
    </main>
  </body>
</html>
