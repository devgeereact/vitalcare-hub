# The only way code reaches the server. Run by hand (Actions > Deploy > Run workflow) on main.
#
#   1. build   : checks CI is green for this exact commit, builds the release, uploads it as an artifact.
#                No deploy secrets are available here.
#   2. deploy  : waits for the owner's approval (GitHub environment "production"), then uploads over SFTP and asks
#                the server's gate to verify and activate. The key can only upload files and run the gate's verbs.
#
# See docs/DEPLOYMENT.md. Nothing in this file contains a secret; the secrets are environment secrets.
name: Deploy

on:
  workflow_dispatch:
    inputs:
      api:
        description: "Deploy the PHP API (runs a pinned backup first if migrations are pending)"
        type: boolean
        default: true
      site:
        description: "Deploy the built front end (also needs the repository variable LAUNCH_APPROVED=yes)"
        type: boolean
        default: false
      htaccess:
        description: "Merge our rules into the live .htaccess (origin lock is never touched)"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      checks: read
    steps:
      - name: Only main can be deployed
        run: |
          if [ "${GITHUB_REF}" != "refs/heads/main" ]; then echo "Deploys run from main only (this run is on ${GITHUB_REF})."; exit 1; fi
          if [ "${{ inputs.api }}${{ inputs.site }}${{ inputs.htaccess }}" = "falsefalsefalse" ]; then echo "Nothing selected to deploy."; exit 1; fi

      - name: The front end needs the launch approval
        if: ${{ inputs.site }}
        env:
          LAUNCH_APPROVED: ${{ vars.LAUNCH_APPROVED }}
        run: |
          if [ "${LAUNCH_APPROVED}" != "yes" ]; then
            echo "Refusing to deploy the site: the repository variable LAUNCH_APPROVED is not 'yes'. Set it only when the release plan's gates are met."
            exit 1
          fi

      - name: CI must be green for this exact commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          result="$(gh api "repos/${GITHUB_REPOSITORY}/commits/${GITHUB_SHA}/check-runs?per_page=100" \
            --jq '[.check_runs[] | select(.name == "check")] | if length == 0 then "none" else (map(.conclusion) | if all(. == "success") then "success" else "failed" end) end')"
          case "$result" in
            success) echo "CI is green for ${GITHUB_SHA}." ;;
            none) echo "No CI run found for ${GITHUB_SHA} (docs-only commits skip CI). Run the CI workflow on this commit first."; exit 1 ;;
            *) echo "CI is not green for ${GITHUB_SHA}."; exit 1 ;;
          esac

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        if: ${{ inputs.site }}
        with:
          cache: true

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: ${{ inputs.site }}
        with:
          node-version-file: .node-version

      - name: Build the front end
        if: ${{ inputs.site }}
        env:
          VITE_CLERK_PUBLISHABLE_KEY: ${{ vars.VITE_CLERK_PUBLISHABLE_KEY }}
          VITE_TURNSTILE_SITE_KEY: ${{ vars.VITE_TURNSTILE_SITE_KEY }}
        run: |
          pnpm install --frozen-lockfile
          pnpm build

      - name: Package the release
        run: |
          if [ "${{ inputs.site }}" = "true" ]; then bash scripts/build-release.sh "${GITHUB_SHA}"; else bash scripts/build-release.sh "${GITHUB_SHA}" --no-site; fi

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-${{ github.sha }}
          path: .release/${{ github.sha }}
          retention-days: 7
          if-no-files-found: error

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Required reviewer: the owner. The job, and every secret below, waits here until they approve.
    environment: production
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-${{ github.sha }}
          path: .release/${{ github.sha }}

      - name: Deploy over SFTP through the gate
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
        run: |
          umask 077
          export DEPLOY_KEY="${RUNNER_TEMP}/deploy_key" DEPLOY_KNOWN_HOSTS_FILE="${RUNNER_TEMP}/known_hosts"
          trap 'rm -f "${DEPLOY_KEY}" "${DEPLOY_KNOWN_HOSTS_FILE}"' EXIT
          printf '%s\n' "${DEPLOY_SSH_KEY}" > "${DEPLOY_KEY}"
          printf '%s\n' "${DEPLOY_KNOWN_HOSTS}" > "${DEPLOY_KNOWN_HOSTS_FILE}"
          export DEPLOY_KNOWN_HOSTS="${DEPLOY_KNOWN_HOSTS_FILE}"
          unset DEPLOY_SSH_KEY
          args=()
          [ "${{ inputs.api }}" = "true" ] && args+=(--api)
          [ "${{ inputs.site }}" = "true" ] && args+=(--site)
          [ "${{ inputs.htaccess }}" = "true" ] && args+=(--htaccess)
          bash scripts/deploy-sftp.sh status || true
          bash scripts/deploy-sftp.sh "${GITHUB_SHA}" "${args[@]}"

      - name: Smoke tests on the public URL
        run: |
          short="${GITHUB_SHA:0:12}"
          if [ "${{ inputs.api }}" = "true" ]; then
            for i in 1 2 3 4 5; do
              body="$(curl -fsS --max-time 20 https://vitalcare.uk/api/health || true)"
              case "$body" in *'"status":"ok"'*"\"release\":\"${short}\""*) echo "API is live at ${short}."; break ;; esac
              [ "$i" = 5 ] && { echo "The public API does not report release ${short}."; exit 1; }
              sleep 5
            done
          fi
          if [ "${{ inputs.site }}" = "true" ]; then
            got="$(curl -fsS --max-time 20 "https://vitalcare.uk/build-id.txt?r=${GITHUB_SHA}" | head -c 40 || true)"
            [ "$got" = "${GITHUB_SHA}" ] || { echo "The public site does not show build ${short}."; exit 1; }
            echo "Site is live at ${short}."
          fi
