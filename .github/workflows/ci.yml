# Runs on every push to main and every pull request. Never deploys and never uses secrets.
name: CI

on:
  push:
    branches: [main]
    paths-ignore: ["docs/**", "**/*.md", ".agent/**"]
  pull_request:
    paths-ignore: ["docs/**", "**/*.md", ".agent/**"]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0 # full history for the secret scan

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          cache: true

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version

      - run: pnpm install --frozen-lockfile

      - name: Lint, typecheck, test, build
        run: pnpm check

      - name: PHP syntax check
        if: hashFiles('backend/**/*.php') != ''
        run: find backend -name '*.php' -not -path 'backend/vendor/*' -print0 | xargs -0 -n1 php -l

      - name: Secret scan (git history + build output)
        env:
          GITLEAKS_VERSION: 8.30.1
          GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          curl -fsSL -o /tmp/gitleaks.tgz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  /tmp/gitleaks.tgz" | sha256sum --check -
          tar -xzf /tmp/gitleaks.tgz -C /tmp gitleaks
          /tmp/gitleaks git --redact --no-banner .
          /tmp/gitleaks dir --redact --no-banner dist
